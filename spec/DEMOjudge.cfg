\* One submission, deep enough for liveness and the whole attempt arithmetic.
\* Verdict is a pass, an ordinary failure and the compile failure: the case
\* alphabet is two words, so Worse has something to choose between. All six
\* words would multiply the logs by 6^Len.
SPECIFICATION Spec

CONSTANTS
    Submission = {"s1"}
    Runner = {"j1", "j2"}
    Verdict = {"AC", "WA", "CE"}
    MaxAttempts = 2
    MaxResolves = 1

INVARIANTS
    NoLoss
    FoldIdempotent
    FoldOrderInsensitive

PROPERTIES
    Progress

\* Deadlock is off: with every submission Terminal nothing is enabled, not a bug.
CHECK_DEADLOCK FALSE
